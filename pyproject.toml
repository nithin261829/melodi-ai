[project]
name = "melodi-ai"
version = "0.1.0"
description = "Melodi AI: context-aware playlist planner for the Melo app"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
    "ytmusicapi>=1.12.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
