<text x="629" y="465" font-size="13.5" font-weight="normal" fill="#555566" text-anchor="start">code: real songs + radio from likes</text>
<rect x="615" y="504" width="370" height="76" rx="10" fill="#ffffff" stroke="#2f80ed" stroke-width="1.5"/>
<text x="629" y="531" font-size="16.5" font-weight="700" fill="#1d1d27" text-anchor="start">5  Score</text>
<text x="629" y="553" font-size="13.5" font-weight="normal" fill="#555566" text-anchor="start">code: merge duplicates, rank, top 40</text>
<rect x="615" y="592" width="370" height="76" rx="10" fill="#ebe3ff" stroke="#8b5cff" stroke-width="1.5"/>
<text x="629" y="619" font-size="16.5" font-weight="700" fill="#1d1d27" text-anchor="start">6  Sequence</text>
