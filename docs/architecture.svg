<text x="722.0" y="881" font-size="13.5" font-weight="normal" fill="#555566" text-anchor="start">from GPS speed</text>
<rect x="1037.0" y="814" width="313.0" height="96" rx="10" fill="#ffffff" stroke="#14a37f" stroke-width="1.5"/>
