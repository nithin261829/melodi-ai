<rect x="430" y="965" width="22" height="16" rx="4" fill="#ffffff" stroke="#2f80ed" stroke-width="1.5"/>
<text x="462" y="978" font-size="13.5" font-weight="normal" fill="#1d1d27" text-anchor="start">Plain code step (deterministic, unit-tested)</text>
